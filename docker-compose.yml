services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alert
      POSTGRES_USER: alert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alert_dev_haslo}
    ports:
      # tylko localhost – baza nie jest wystawiona do sieci
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alert -d alert"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
